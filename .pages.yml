media:
  input: public/media
  output: /media
  rename: safe
  categories: [image]
content:
  - name: homepage
    label: Trang chủ & giới thiệu
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - { name: siteTitle, label: Tiêu đề website (SEO), type: string }
      - { name: siteDescription, label: Mô tả website (SEO), type: text }
      - { name: heroEyebrow, label: Dòng chữ nhỏ đầu trang, type: string }
      - { name: heroTitleLine1, label: Tiêu đề lớn – dòng 1, type: string }
      - { name: heroTitleLine2, label: Tiêu đề lớn – dòng 2, type: string }
      - { name: heroTitleLine3, label: Tiêu đề lớn – dòng 3, type: string }
      - { name: heroDescription, label: Mô tả phần mở đầu, type: text }
      - { name: logoImage, label: Logo chính thức của OSC, type: image, description: Tải logo PNG hoặc WebP nền trong suốt }
      - { name: heroImage, label: Ảnh sân khấu đầu trang, type: image }
      - { name: aboutEyebrow, label: Nhãn phần giới thiệu, type: string }
      - { name: aboutTitle, label: Tiêu đề giới thiệu, type: string }
      - { name: aboutDescription, label: Nội dung giới thiệu, type: text }
      - { name: aboutQuote, label: Trích dẫn nổi bật, type: text }
      - { name: missionTitle, label: Tiêu đề sứ mệnh, type: string }
      - { name: missionDescription, label: Mô tả sứ mệnh, type: text }
      - { name: programTitle, label: Tiêu đề sự kiện, type: string }
      - { name: programDescription, label: Mô tả sự kiện, type: text }
      - { name: joinTitle, label: Tiêu đề tham gia OSC, type: string }
      - { name: joinDescription, label: Nội dung tham gia OSC, type: text }
      - { name: recruitmentUrl, label: Link tuyển thành viên, type: string }
      - { name: facebookUrl, label: Facebook chính thức, type: string }
      - { name: contactEmail, label: Email liên hệ, type: string }
      - { name: contactNote, label: Thông báo liên hệ, type: text }
      - { name: footerNote, label: Dòng chân trang, type: string }
      - { name: boardEnabled, label: Hiện mục Ban Chủ nhiệm, type: boolean }
      - { name: boardNavLabel, label: Tên menu Ban Chủ nhiệm, type: string }
      - { name: boardEyebrow, label: Nhãn Ban Chủ nhiệm, type: string }
      - { name: boardTitle, label: Tiêu đề Ban Chủ nhiệm, type: string }
      - { name: boardDescription, label: Mô tả Ban Chủ nhiệm, type: text }
      - { name: boardTerm, label: Nhiệm kỳ, type: string }
      - name: boardMembers
        label: Thành viên Ban Chủ nhiệm
        type: object
        list: true
        fields:
          - { name: name, label: Họ và tên, type: string, required: true }
          - { name: role, label: Chức vụ, type: string, required: true }
          - { name: image, label: Ảnh chân dung, type: image }
          - { name: description, label: Giới thiệu ngắn, type: text }
      - { name: navIntroLabel, label: navIntroLabel, type: string }
      - { name: navEventsLabel, label: navEventsLabel, type: string }
      - { name: navPeopleLabel, label: navPeopleLabel, type: string }
      - { name: navJoinLabel, label: navJoinLabel, type: string }
      - { name: navExtraLabel, label: navExtraLabel, type: string }
      - { name: heroExploreText, label: heroExploreText, type: string }
      - { name: heroSerial, label: heroSerial, type: string }
      - { name: scrollHint, label: scrollHint, type: string }
      - { name: programFooterNote, label: programFooterNote, type: string }
      - { name: cultureCenter, label: cultureCenter, type: string }
      - { name: cultureLabelOne, label: cultureLabelOne, type: string }
      - { name: cultureLabelTwo, label: cultureLabelTwo, type: string }
      - { name: cultureLabelThree, label: cultureLabelThree, type: string }
      - { name: experienceRightLabel, label: experienceRightLabel, type: string }
      - { name: aboutSideLabel, label: aboutSideLabel, type: string }
      - { name: brandSubtitle, label: brandSubtitle, type: string }
      - { name: headerEdition, label: headerEdition, type: string }
      - { name: marqueeText, label: marqueeText, type: string }
      - { name: experienceKicker, label: experienceKicker, type: string }
      - { name: experienceGiantWord, label: experienceGiantWord, type: string }
      - { name: experienceFooter, label: experienceFooter, type: string }
      - { name: experienceAct1Top, label: experienceAct1Top, type: string }
      - { name: experienceAct1Bottom, label: experienceAct1Bottom, type: string }
      - { name: experienceAct2Top, label: experienceAct2Top, type: string }
      - { name: experienceAct2Bottom, label: experienceAct2Bottom, type: string }
      - { name: experienceAct3Top, label: experienceAct3Top, type: string }
      - { name: experienceAct3Bottom, label: experienceAct3Bottom, type: string }
      - { name: missionEyebrow, label: missionEyebrow, type: string }
      - { name: programEyebrow, label: programEyebrow, type: string }
      - { name: cultureEyebrow, label: cultureEyebrow, type: string }
      - { name: cultureTitleLine1, label: cultureTitleLine1, type: string }
      - { name: cultureTitleLine2, label: cultureTitleLine2, type: string }
      - { name: cultureDescription, label: cultureDescription, type: text }
      - { name: joinEyebrow, label: joinEyebrow, type: string }
      - { name: footerSloganLine1, label: footerSloganLine1, type: string }
      - { name: footerSloganLine2, label: footerSloganLine2, type: string }
      - name: customSections
        label: Mục bổ sung trên website
        type: object
        list: true
        fields:
          - { name: eyebrow, label: Nhãn mục, type: string }
          - { name: title, label: Tiêu đề mục, type: string }
          - { name: body, label: Nội dung, type: text }
          - { name: image, label: Hình ảnh, type: image }
          - { name: theme, label: Màu nền (dark/light), type: string }
          - { name: buttonLabel, label: Tên nút liên kết, type: string }
          - { name: buttonUrl, label: Đường dẫn nút liên kết, type: string }
  - name: events
    label: Sự kiện & hoạt động
    type: collection
    path: content/events
    format: json
    filename: '{primary}.json'
    view:
      primary: title
      fields: [title, category, pinned, eventDate, order]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - { name: title, label: Tên sự kiện, type: string, required: true }
      - { name: category, label: Phân loại, type: string }
      - { name: description, label: Mô tả, type: text }
      - { name: image, label: Ảnh bìa sự kiện, type: image }
      - name: gallery
        label: Album ảnh sự kiện (tối đa 12 ảnh)
        type: image
        options:
          multiple: { max: 12 }
          extensions: [jpg, jpeg, png, webp, avif]
      - { name: eventDate, label: Ngày diễn ra, type: string }
      - { name: location, label: Địa điểm, type: string }
      - { name: detailsUrl, label: Link thông tin chi tiết, type: string }
      - name: accent
        label: Màu chủ đề
        type: select
        options:
          values:
            - { name: red, label: Đỏ sân khấu }
            - { name: gold, label: Vàng ánh đèn }
            - { name: violet, label: Tím huyền bí }
            - { name: blue, label: Xanh ánh sáng }
      - { name: pinned, label: Ghim lên đầu danh sách, type: boolean }
      - { name: order, label: Thứ tự phụ khi trùng ngày, type: number }
